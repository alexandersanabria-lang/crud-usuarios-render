<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRUD Usuarios — Spring Boot + PostgreSQL</title>
<style>
  :root{
    --bg:#10131a; --panel:#161a23; --line:#262b38; --text:#e7e9f1; --dim:#8992a8;
    --accent:#4ee7c0; --danger:#ff6b6b; --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:Arial, sans-serif; margin:0; padding:40px 20px;}
  .wrap{max-width:720px; margin:0 auto;}
  h1{font-size:1.4rem; margin-bottom:4px;}
  p.sub{color:var(--dim); font-size:0.9rem; margin-bottom:28px; font-family:var(--mono);}
  form{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:20px; display:grid; grid-template-columns:1fr 1fr 100px; gap:12px; margin-bottom:24px;
  }
  form input{
    background:#0d1017; border:1px solid var(--line); border-radius:6px; padding:10px 12px;
    color:var(--text); font-size:0.9rem;
  }
  form button{
    grid-column:1/-1; background:var(--accent); border:none; border-radius:6px;
    padding:10px; font-weight:bold; cursor:pointer; color:#0a0d12;
  }
  table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  th, td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); font-size:0.88rem;}
  th{color:var(--dim); font-family:var(--mono); font-weight:normal;}
  button.action{
    border:1px solid var(--line); background:transparent; color:var(--text);
    border-radius:5px; padding:5px 10px; cursor:pointer; font-size:0.8rem; margin-right:4px;
  }
  button.action.del{color:var(--danger); border-color:var(--danger);}
  #msg{font-family:var(--mono); font-size:0.85rem; color:var(--accent); min-height:20px; margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>CRUD Usuarios</h1>
  <p class="sub">Spring Boot + PostgreSQL — /api/usuarios</p>

  <form id="form-usuario">
    <input type="hidden" id="usuario-id">
    <input type="text" id="nombre" placeholder="Nombre" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="number" id="edad" placeholder="Edad" required>
    <button type="submit" id="btn-submit">Crear usuario</button>
  </form>

  <div id="msg"></div>

  <table>
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Edad</th><th></th></tr>
    </thead>
    <tbody id="tabla-usuarios"></tbody>
  </table>
</div>

<script>
  const API = '/api/usuarios';
  const form = document.getElementById('form-usuario');
  const tabla = document.getElementById('tabla-usuarios');
  const msg = document.getElementById('msg');
  const btnSubmit = document.getElementById('btn-submit');

  async function cargarUsuarios(){
    const res = await fetch(API);
    const usuarios = await res.json();
    tabla.innerHTML = '';
    usuarios.forEach(u => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${u.id}</td>
        <td>${u.nombre}</td>
        <td>${u.email}</td>
        <td>${u.edad}</td>
        <td>
          <button class="action" onclick="editar(${u.id}, '${u.nombre}', '${u.email}', ${u.edad})">Editar</button>
          <button class="action del" onclick="eliminar(${u.id})">Eliminar</button>
        </td>`;
      tabla.appendChild(tr);
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('usuario-id').value;
    const body = JSON.stringify({
      nombre: document.getElementById('nombre').value,
      email: document.getElementById('email').value,
      edad: parseInt(document.getElementById('edad').value)
    });

    let res;
    if(id){
      res = await fetch(`${API}/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body });
    } else {
      res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body });
    }

    if(res.ok){
      msg.textContent = id ? 'Usuario actualizado correctamente.' : 'Usuario creado correctamente.';
      form.reset();
      document.getElementById('usuario-id').value = '';
      btnSubmit.textContent = 'Crear usuario';
      cargarUsuarios();
    } else {
      msg.textContent = 'Ocurrió un error al guardar el usuario.';
    }
  });

  function editar(id, nombre, email, edad){
    document.getElementById('usuario-id').value = id;
    document.getElementById('nombre').value = nombre;
    document.getElementById('email').value = email;
    document.getElementById('edad').value = edad;
    btnSubmit.textContent = 'Actualizar usuario';
    window.scrollTo(0,0);
  }

  async function eliminar(id){
    if(!confirm('¿Eliminar este usuario?')) return;
    const res = await fetch(`${API}/${id}`, { method:'DELETE' });
    if(res.ok){
      msg.textContent = 'Usuario eliminado.';
      cargarUsuarios();
    }
  }

  cargarUsuarios();
</script>
</body>
</html>
